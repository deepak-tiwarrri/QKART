services:
  - type: web
    name: qkart-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /v1/products
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Set this manually in the Render dashboard after creating the service
      - key: MONGODB_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRATION_MINUTES
        value: 240
